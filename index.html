<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftCart - Modern E-Commerce</title>

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Icons (Phosphor Icons via CDN) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 antialiased">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 transition-all duration-300 bg-white/80 backdrop-blur-md border-b border-gray-100 shadow-sm"
        id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">

                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-2 cursor-pointer group">
                    <div
                        class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg shadow-brand-500/30 transition-transform group-hover:scale-105 group-hover:rotate-3">
                        <i class="ph-bold ph-shopping-bag"></i>
                    </div>
                    <span
                        class="font-bold text-2xl tracking-tight text-gray-900 group-hover:text-brand-600 transition-colors">
                        Swift<span class="text-brand-600">Cart</span>
                    </span>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#" class="text-gray-600 hover:text-brand-600 font-medium transition-colors relative group">
                        Home
                        <span
                            class="absolute -bottom-1 left-0 w-0 h-0.5 bg-brand-600 transition-all group-hover:w-full"></span>
                    </a>
                    <a href="#" class="text-gray-600 hover:text-brand-600 font-medium transition-colors relative group">
                        Products
                        <span
                            class="absolute -bottom-1 left-0 w-0 h-0.5 bg-brand-600 transition-all group-hover:w-full"></span>
                    </a>
                    <a href="#" class="text-gray-600 hover:text-brand-600 font-medium transition-colors relative group">
                        About
                        <span
                            class="absolute -bottom-1 left-0 w-0 h-0.5 bg-brand-600 transition-all group-hover:w-full"></span>
                    </a>
                    <a href="#" class="text-gray-600 hover:text-brand-600 font-medium transition-colors relative group">
                        Contact
                        <span
                            class="absolute -bottom-1 left-0 w-0 h-0.5 bg-brand-600 transition-all group-hover:w-full"></span>
                    </a>
                </div>

                <!-- Right Actions -->
                <div class="flex items-center gap-4">
                    <!-- Search Icon (Desktop) -->
                    <button
                        class="hidden md:flex p-2 text-gray-500 hover:text-brand-600 transition-colors rounded-full hover:bg-gray-100">
                        <i class="ph ph-magnifying-glass text-xl"></i>
                    </button>

                    <!-- Cart Button -->
                    <button
                        class="relative p-2 text-gray-800 hover:text-brand-600 transition-colors rounded-full hover:bg-brand-50 group"
                        id="cart-btn">
                        <i class="ph ph-shopping-cart text-2xl"></i>
                        <span
                            class="absolute top-0 right-0 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-brand-600 rounded-full shadow-sm group-hover:scale-110 transition-transform"
                            id="cart-count">
                            0
                        </span>
                    </button>

                    <!-- Mobile Menu Button -->
                    <button
                        class="md:hidden p-2 text-gray-600 hover:text-brand-600 transition-colors rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
                        id="mobile-menu-btn">
                        <i class="ph ph-list text-2xl" id="menu-icon"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu (Hidden by default) -->
        <div class="md:hidden hidden bg-white border-t border-gray-100 absolute w-full left-0 shadow-lg"
            id="mobile-menu">
            <div class="px-4 pt-2 pb-6 space-y-2">
                <a href="#"
                    class="block px-3 py-3 rounded-lg text-base font-medium text-gray-700 hover:text-brand-600 hover:bg-brand-50 transition-colors">
                    Home
                </a>
                <a href="#"
                    class="block px-3 py-3 rounded-lg text-base font-medium text-gray-700 hover:text-brand-600 hover:bg-brand-50 transition-colors">
                    Products
                </a>
                <a href="#"
                    class="block px-3 py-3 rounded-lg text-base font-medium text-gray-700 hover:text-brand-600 hover:bg-brand-50 transition-colors">
                    About
                </a>
                <a href="#"
                    class="block px-3 py-3 rounded-lg text-base font-medium text-gray-700 hover:text-brand-600 hover:bg-brand-50 transition-colors">
                    Contact
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero Section (Placeholder to show scrolling effect) -->
    <!-- Hero Section -->
    <div class="relative h-screen min-h-[600px] flex items-center justify-center bg-cover bg-center bg-no-repeat"
        style="background-image: url('Assets/banner-image.png');">
        <!-- Overlay -->
        <div class="absolute inset-0 bg-black/40"></div>

        <!-- Content -->
        <div class="relative z-10 text-center px-4 max-w-4xl mx-auto">
            <span
                class="inline-block py-1 px-3 rounded-full bg-brand-600/20 text-brand-50 border border-brand-400/30 text-sm font-semibold mb-6 backdrop-blur-sm tracking-wide uppercase">New
                Arrivals 2024</span>

            <h1 class="text-4xl md:text-7xl font-bold text-white mb-6 leading-tight drop-shadow-lg">
                Best Collection <br />
                <span class="text-brand-400">For You</span>
            </h1>

            <p class="text-lg md:text-xl text-gray-200 mb-10 max-w-2xl mx-auto drop-shadow-md">
                Discover the latest trends in fashion and technology with our exclusive selection. Premium quality,
                swift delivery, and exceptional style.
            </p>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button
                    class="px-8 py-4 bg-brand-600 text-white rounded-full font-bold text-lg shadow-lg shadow-brand-600/40 hover:bg-brand-700 hover:shadow-brand-600/60 hover:scale-105 transition-all transform">
                    Shop Now
                </button>
                <button
                    class="px-8 py-4 bg-white/10 backdrop-blur-md text-white border border-white/30 rounded-full font-bold text-lg hover:bg-white/20 hover:border-white/50 transition-all">
                    View Lookbook
                </button>
            </div>
        </div>

        <!-- Scroll Indicator -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounce">
            <i class="ph ph-arrow-down text-white text-3xl opacity-70"></i>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
